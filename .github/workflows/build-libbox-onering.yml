name: Build libbox.aar with OneRing

on:
  push:
    branches: [ reF1nd-stable ]
    paths:
      - 'common/onering/**'
      - 'transport/v2raywebsocket/**'
      - 'transport/v2rayhttpupgrade/**'
      - 'experimental/libbox/**'
      - '.github/workflows/build-libbox-onering.yml'
  workflow_dispatch:

jobs:
  build-libbox:
    strategy:
      matrix:
        include:
          - name: arm64
            goos: android
            goarch: arm64
            ndk: aarch64-linux-android
            ndk_abi: arm64-v8a
          - name: arm
            goos: android
            goarch: arm
            ndk: armv7a-linux-androideabi
            ndk_abi: armeabi-v7a
          - name: amd64
            goos: android
            goarch: amd64
            ndk: x86_64-linux-android
            ndk_abi: x86_64
          - name: 386
            goos: android
            goarch: 386
            ndk: i686-linux-android
            ndk_abi: x86
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          add-to-path: true
      
      - name: Setup OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install gomobile
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.12
      
      - name: Build libbox for ${{ matrix.name }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/${{ matrix.goarch }}
          mkdir -p dist/${{ matrix.goarch }}
          mv libbox.aar libbox-${{ matrix.name }}.aar
          mv libbox-legacy.aar libbox-legacy-${{ matrix.name }}.aar
          cp libbox-${{ matrix.name }}.aar libbox-legacy-${{ matrix.name }}.aar dist/${{ matrix.goarch }}/
      
      - name: Verify AAR
        run: |
          ls -lh dist/${{ matrix.goarch }}/
          unzip -l dist/${{ matrix.goarch }}/libbox-${{ matrix.name }}.aar | head -20
          echo "---"
          unzip -l dist/${{ matrix.goarch }}/libbox-legacy-${{ matrix.name }}.aar | head -20
      
      - name: Upload libbox-${{ matrix.name }}.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-${{ matrix.goarch }}
          path: dist/${{ matrix.goarch }}/
          retention-days: 7
  
  merge-aar:
    needs: build-libbox
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout sing-box (for merge_aar tool)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      
      - name: Download all AAR artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libbox-*
          path: artifacts
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Merge multi-arch AAR using official tool
        run: |
          set -euo pipefail
          
          echo "=== Using official merge_aar tool ==="
          
          # Merge main variant (libbox.aar)
          echo "Merging libbox.aar from all architectures..."
          go run ./cmd/internal/merge_aar \
            -output libbox.aar \
            artifacts/libbox-386/libbox-386.aar \
            artifacts/libbox-amd64/libbox-amd64.aar \
            artifacts/libbox-arm/libbox-arm.aar \
            artifacts/libbox-arm64/libbox-arm64.aar
          
          # Merge legacy variant (libbox-legacy.aar)
          echo "Merging libbox-legacy.aar from all architectures..."
          go run ./cmd/internal/merge_aar \
            -output libbox-legacy.aar \
            artifacts/libbox-386/libbox-legacy-386.aar \
            artifacts/libbox-amd64/libbox-legacy-amd64.aar \
            artifacts/libbox-arm/libbox-legacy-arm.aar \
            artifacts/libbox-arm64/libbox-legacy-arm64.aar
          
          echo "=== Merged AAR files ==="
          ls -lh libbox.aar libbox-legacy.aar
          
          echo ""
          echo "=== Verify libbox.aar structure ==="
          unzip -l libbox.aar | head -30
          
          echo ""
          echo "=== Verify libbox-legacy.aar structure ==="
          unzip -l libbox-legacy.aar | head -30
          
          echo ""
          echo "=== Verify classes.jar in libbox.aar ==="
          unzip -q libbox.aar classes.jar
          echo "Top-level classes in libbox:"
          jar tf classes.jar | grep -E "^io/nekohasekai/libbox/[A-Z]" 2>/dev/null | head -20 || true
          echo "✅ AAR merge completed successfully using official tool"
      
      - name: Upload merged libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-merged
          path: |
            libbox.aar
            libbox-legacy.aar
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            libbox.aar
            libbox-legacy.aar
          tag_name: ${{ github.ref_name }}
          body: |
            ## libbox.aar with OneRing Support
            
            Built from commit: ${{ github.sha }}
            
            ### Variants
            - **libbox.aar**: Main variant (API 23+) with all features including naive_outbound
            - **libbox-legacy.aar**: Legacy variant (API 21+) without naive_outbound
            
            ### Features
            - ✅ OneRing bypass technique
            - ✅ Multi-architecture support (arm64, arm, x86_64, x86)
            - ✅ All critical bugs fixed
            
            ### Architectures
            - arm64-v8a (64-bit ARM)
            - armeabi-v7a (32-bit ARM)
            - x86_64 (64-bit x86)
            - x86 (32-bit x86)
