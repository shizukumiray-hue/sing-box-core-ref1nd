name: Build libbox.aar with OneRing

on:
  push:
    branches: [ reF1nd-stable ]
    paths:
      - 'common/onering/**'
      - 'transport/v2raywebsocket/**'
      - 'transport/v2rayhttpupgrade/**'
      - 'experimental/libbox/**'
      - '.github/workflows/build-libbox-onering.yml'
  workflow_dispatch:

jobs:
  build-libbox:
    strategy:
      matrix:
        include:
          - name: arm64
            goos: android
            goarch: arm64
            ndk: aarch64-linux-android
            ndk_abi: arm64-v8a
          - name: arm
            goos: android
            goarch: arm
            ndk: armv7a-linux-androideabi
            ndk_abi: armeabi-v7a
          - name: amd64
            goos: android
            goarch: amd64
            ndk: x86_64-linux-android
            ndk_abi: x86_64
          - name: 386
            goos: android
            goarch: 386
            ndk: i686-linux-android
            ndk_abi: x86
    
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false
      
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          add-to-path: true
      
      - name: Setup OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install gomobile
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.12
      
      - name: Build libbox for ${{ matrix.name }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/${{ matrix.goarch }}
          mkdir -p dist/${{ matrix.goarch }}
          mv libbox.aar libbox-${{ matrix.name }}.aar
          mv libbox-legacy.aar libbox-legacy-${{ matrix.name }}.aar
          cp libbox-${{ matrix.name }}.aar libbox-legacy-${{ matrix.name }}.aar dist/${{ matrix.goarch }}/
      
      - name: Verify AAR
        run: |
          ls -lh dist/${{ matrix.goarch }}/
          unzip -l dist/${{ matrix.goarch }}/libbox-${{ matrix.name }}.aar | head -20
          echo "---"
          unzip -l dist/${{ matrix.goarch }}/libbox-legacy-${{ matrix.name }}.aar | head -20
      
      - name: Upload libbox-${{ matrix.name }}.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-${{ matrix.goarch }}
          path: dist/${{ matrix.goarch }}/
          retention-days: 7
  
  merge-aar:
    needs: build-libbox
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all AAR artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Merge multi-arch AAR
        run: |
          mkdir -p merged/jni merged-legacy/jni
          
          # Merge main variant (libbox.aar)
          for arch in arm64 arm amd64 386; do
            echo "Processing libbox-${arch}.aar..."
            unzip -q artifacts/libbox-${arch}/libbox-${arch}.aar -d temp-${arch}
            
            # Copy JNI libs with correct structure
            if [ -d "temp-${arch}/jni" ]; then
              cp -rv temp-${arch}/jni/* merged/jni/
            fi
            
            # Copy classes.jar from first arch (they're identical)
            if [ "$arch" = "arm64" ]; then
              cp temp-${arch}/classes.jar merged/
              cp temp-${arch}/AndroidManifest.xml merged/
              [ -f temp-${arch}/R.txt ] && cp temp-${arch}/R.txt merged/
              [ -f temp-${arch}/proguard.txt ] && cp temp-${arch}/proguard.txt merged/
            fi
            
            rm -rf temp-${arch}
          done
          
          # Merge legacy variant (libbox-legacy.aar)
          for arch in arm64 arm amd64 386; do
            echo "Processing libbox-legacy-${arch}.aar..."
            unzip -q artifacts/libbox-${arch}/libbox-legacy-${arch}.aar -d temp-legacy-${arch}
            
            # Copy JNI libs with correct structure
            if [ -d "temp-legacy-${arch}/jni" ]; then
              cp -rv temp-legacy-${arch}/jni/* merged-legacy/jni/
            fi
            
            # Copy classes.jar from first arch (they're identical)
            if [ "$arch" = "arm64" ]; then
              cp temp-legacy-${arch}/classes.jar merged-legacy/
              cp temp-legacy-${arch}/AndroidManifest.xml merged-legacy/
              [ -f temp-legacy-${arch}/R.txt ] && cp temp-legacy-${arch}/R.txt merged-legacy/
              [ -f temp-legacy-${arch}/proguard.txt ] && cp temp-legacy-${arch}/proguard.txt merged-legacy/
            fi
            
            rm -rf temp-legacy-${arch}
          done
          
          # List merged structure
          echo "Merged libbox.aar structure:"
          find merged -type f
          echo "---"
          echo "Merged libbox-legacy.aar structure:"
          find merged-legacy -type f
          
          # Package merged AARs
          cd merged && zip -r ../libbox.aar . && cd ..
          cd merged-legacy && zip -r ../libbox-legacy.aar . && cd ..
          
          ls -lh libbox.aar libbox-legacy.aar
          echo "---"
          unzip -l libbox.aar
          echo "---"
          unzip -l libbox-legacy.aar
      
      - name: Upload merged libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-merged
          path: |
            libbox.aar
            libbox-legacy.aar
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            libbox.aar
            libbox-legacy.aar
          tag_name: ${{ github.ref_name }}
          body: |
            ## libbox.aar with OneRing Support
            
            Built from commit: ${{ github.sha }}
            
            ### Variants
            - **libbox.aar**: Main variant (API 23+) with all features including naive_outbound
            - **libbox-legacy.aar**: Legacy variant (API 21+) without naive_outbound
            
            ### Features
            - ✅ OneRing bypass technique
            - ✅ Multi-architecture support (arm64, arm, x86_64, x86)
            - ✅ All critical bugs fixed
            
            ### Architectures
            - arm64-v8a (64-bit ARM)
            - armeabi-v7a (32-bit ARM)
            - x86_64 (64-bit x86)
            - x86 (32-bit x86)
